services:
  # 1. Database Service (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: vantage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vantage_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-vantage_news}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-vantage_news}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Distributed Governance & Caching (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: vantage-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Backend API & Workers (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vantage-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:vantage_secret_password@db:5432/vantage_news}
      GOVERNANCE_BACKEND: ${GOVERNANCE_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-vantage:gov:}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OPS_API_KEY: ${OPS_API_KEY:-}
      OPS_API_KEY_SECONDARY: ${OPS_API_KEY_SECONDARY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_API_KEY_SECONDARY: ${ADMIN_API_KEY_SECONDARY:-}
      SECURITY_API_KEY: ${SECURITY_API_KEY:-}
      SECURITY_API_KEY_SECONDARY: ${SECURITY_API_KEY_SECONDARY:-}
      ENABLE_OPS_CONTROLS: ${ENABLE_OPS_CONTROLS:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_PERSPECTIVE_MODEL: ${OPENAI_PERSPECTIVE_MODEL:-gpt-4o-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      XQUIK_API_KEY: ${XQUIK_API_KEY:-}
      XQUIK_BASE_URL: ${XQUIK_BASE_URL:-https://xquik.com/api/v1}
      NITTER_ENABLED: ${NITTER_ENABLED:-true}
      NITTER_INSTANCES: ${NITTER_INSTANCES:-}
      NITTER_HTTP_PROXY: ${NITTER_HTTP_PROXY:-}
      NITTER_MAX_INSTANCES: ${NITTER_MAX_INSTANCES:-8}
      NITTER_MAX_SUCCESSFUL_INSTANCES: ${NITTER_MAX_SUCCESSFUL_INSTANCES:-2}
      NITTER_MAX_RETRIES: ${NITTER_MAX_RETRIES:-1}
      NITTER_REQUEST_TIMEOUT_SECONDS: ${NITTER_REQUEST_TIMEOUT_SECONDS:-8}
      NITTER_TOTAL_TIMEOUT_SECONDS: ${NITTER_TOTAL_TIMEOUT_SECONDS:-120}
      NITTER_BACKOFF_BASE_SECONDS: ${NITTER_BACKOFF_BASE_SECONDS:-1}
      NITTER_BACKOFF_MAX_SECONDS: ${NITTER_BACKOFF_MAX_SECONDS:-2}
      NITTER_MAX_RETRY_AFTER_SECONDS: ${NITTER_MAX_RETRY_AFTER_SECONDS:-30}
      NITTER_RATE_LIMIT_COOLDOWN_SECONDS: ${NITTER_RATE_LIMIT_COOLDOWN_SECONDS:-300}
      NITTER_BOT_CHECK_COOLDOWN_SECONDS: ${NITTER_BOT_CHECK_COOLDOWN_SECONDS:-900}
      NITTER_FAILURE_COOLDOWN_SECONDS: ${NITTER_FAILURE_COOLDOWN_SECONDS:-60}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-VantageNews/2.0.0}
      TRENDING_W1_VELOCITY: ${TRENDING_W1_VELOCITY:-0.35}
      TRENDING_W2_SOURCES: ${TRENDING_W2_SOURCES:-0.25}
      TRENDING_W3_ENGAGEMENT: ${TRENDING_W3_ENGAGEMENT:-0.25}
      TRENDING_W4_DECAY: ${TRENDING_W4_DECAY:-0.15}
      WORKER_INTERVAL_HOURS: ${WORKER_INTERVAL_HOURS:-2.0}
      MIN_TRENDING_SCORE_REFRESH: ${MIN_TRENDING_SCORE_REFRESH:-0.20}
      STAGNANT_HOURS_THRESHOLD: ${STAGNANT_HOURS_THRESHOLD:-48.0}
      ENABLE_ALERT_EVALUATION: ${ENABLE_ALERT_EVALUATION:-true}
      ALERT_WORKER_ENABLED: ${ALERT_WORKER_ENABLED:-true}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_DIR: /app/backups
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_backups:/app/backups

  # 4. Frontend Application (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
    container_name: vantage-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_backups:
    driver: local
